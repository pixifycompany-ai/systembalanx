# Publica as edge functions do Supabase quando algo em supabase/functions muda
# na main (ou à mão, em Actions → "Deploy edge functions" → Run workflow).
# Precisa do segredo SUPABASE_ACCESS_TOKEN no repositório (token pessoal criado
# em supabase.com/dashboard/account/tokens). O verify_jwt de cada função vem do
# supabase/config.toml.
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hvwuuxvsoyovkvedifco
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checar tipos das funções alteradas
        run: |
          for f in supabase/functions/*/index.ts; do
            deno check "$f" || echo "::warning file=$f::deno check encontrou erros (o deploy continua)"
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar todas as funções
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
